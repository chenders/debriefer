name: Publish to npm

on:
  release:
    types: [published]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install and build
        run: npm ci && npx turbo build

      - name: Publish @debriefer/core
        run: npm publish --provenance --access public || echo "Already published, skipping"
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @debriefer/sources
        run: npm publish --provenance --access public || echo "Already published, skipping"
        working-directory: packages/sources
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @debriefer/ai
        run: npm publish --provenance --access public || echo "Already published, skipping"
        working-directory: packages/ai
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @debriefer/cli
        run: npm publish --provenance --access public || echo "Already published, skipping"
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @debriefer/server
        run: npm publish --provenance --access public || echo "Already published, skipping"
        working-directory: packages/server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @debriefer/mcp
        run: npm publish --provenance --access public || echo "Already published, skipping"
        working-directory: packages/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @debriefer/browser
        run: npm publish --provenance --access public || echo "Already published, skipping"
        working-directory: packages/browser
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
