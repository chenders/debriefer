name: PII & Secrets

# Kept in its own workflow file so the existing CI and Security workflows are
# untouched. The `PII & Secrets Scan` job below is the one to mark as a
# required status check in branch protection.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full-history audit. Catches anything that reached main before
    # these checks existed, and anything a --no-verify push slipped past.
    - cron: "30 4 * * 1"
  # GitHub disables any workflow containing a `schedule:` trigger after 60 days
  # of repository inactivity, and that disables the WHOLE workflow -- its
  # push and pull_request triggers stop firing too. The Security workflow in
  # this repository was found in exactly that state: `disabled_inactivity`,
  # with `Dependency Audit` still listed as a required status check that could
  # no longer report, which blocked every pull request.
  #
  # workflow_dispatch makes a manual run possible, which both recovers from
  # that state and resets the inactivity timer. Check with:
  #   gh workflow list --all
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, repository-wide. `pull_request` (NOT
# pull_request_target) means a fork PR runs with a read-only token and no
# access to repository secrets, so untrusted PR code never sees a privileged
# credential. No job here needs or requests a write scope, and no job
# references a secret.
permissions:
  contents: read

jobs:
  scan:
    name: PII & Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The range scan needs the merge base, and a shallow
          # checkout would silently narrow what is scanned. 292 commits, so
          # the cost is negligible.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned scanners
        # Downloads the exact pinned release assets and verifies their
        # published SHA-256 (.security/tools.lock). Fails closed on mismatch.
        run: .security/install-tools.sh

      - name: Determine scan range
        id: range
        # Every workflow-context value is passed through env rather than
        # interpolated into the script body, so nothing from the event payload
        # is ever evaluated as shell.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          case "$EVENT" in
            pull_request)
              # base.sha is the merge base GitHub computed for this PR.
              base="$PR_BASE_SHA"
              ;;
            push)
              # github.event.before is all-zeros for a newly created branch,
              # and can point at a commit that no longer exists after a force
              # push. Both cases fall through to an empty base, which scans all
              # reachable history rather than silently scanning nothing.
              base="$PUSH_BEFORE"
              ;;
          esac
          # Accept only a 40-hex object id that actually exists here. Anything
          # else becomes an empty base (scan everything) rather than being
          # passed through.
          if ! printf '%s' "$base" | grep -Eq '^[0-9a-f]{40}$' \
             || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=""
          fi
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Scan range and checked-out files
        env:
          SECURITY_TOOLS_DIR: ${{ github.workspace }}/.security/.tools
          SCAN_BASE: ${{ steps.range.outputs.base }}
          SCAN_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$SCAN_BASE" ]; then
            .security/ci-scan.sh --base "$SCAN_BASE" --head "$SCAN_HEAD"
          else
            .security/ci-scan.sh --head "$SCAN_HEAD"
          fi

  # Full-history audit. Scheduled only -- it scans every blob on every ref, so
  # it is far too slow for the per-PR path, and its job is to catch what the
  # incremental checks could not have seen.
  audit:
    name: Full-History Audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned scanners
        run: .security/install-tools.sh

      - name: Fetch all refs
        # The audit's coverage preflight reports refs that exist on origin but
        # are not present locally. Fetch them so that gap is empty.
        run: git fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*" && git fetch --tags origin

      - name: Audit full history
        env:
          SECURITY_TOOLS_DIR: ${{ github.workspace }}/.security/.tools
        # The audit reports findings and coverage gaps; it does not gate
        # merges, so a pre-existing advisory finding cannot wedge the
        # scheduled run. Blocking findings still surface in the log and in the
        # uploaded report.
        run: .security/audit-history.sh --out "$RUNNER_TEMP/audit"

      - name: Upload masked audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pii-audit-report
          # Contains ONLY masked findings -- type, confidence, path, line
          # number. ferret-scan never writes matched values without
          # --show-match, which no script here passes.
          path: ${{ runner.temp }}/audit/
          retention-days: 14
